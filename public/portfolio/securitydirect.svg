<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0f17" />
      <stop offset="100%" stop-color="#030508" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="1000" rx="36" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="400" cy="200" r="260" fill="#ef4444" opacity="0.15" filter="url(#glow)" />
  <circle cx="400" cy="800" r="220" fill="#ef4444" opacity="0.08" filter="url(#glow)" />

  <!-- Outer Phone Body Frame -->
  <rect x="160" y="60" width="480" height="880" rx="48" fill="#0a0d14" stroke="#1e293b" stroke-width="6" />

  <!-- Phone Screen Bezel -->
  <rect x="175" y="75" width="450" height="850" rx="38" fill="#0d0f17" />

  <!-- Dynamic Island / Top Notch -->
  <rect x="350" y="92" width="100" height="24" rx="12" fill="#000000" />
  <circle cx="430" cy="104" r="4" fill="#1e293b" />

  <!-- Status Bar Time & Icons -->
  <text x="210" y="108" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="bold">9:41</text>
  <text x="570" y="108" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="bold">5G 100%</text>

  <!-- App Header / Badge -->
  <rect x="200" y="140" width="400" height="38" rx="19" fill="#ef4444" opacity="0.15" stroke="#ef4444" stroke-width="1.5" />
  <text x="400" y="164" fill="#ef4444" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1.5">HIKVISION & INSTALLATIONS</text>

  <!-- App Title & Subtitle -->
  <text x="400" y="225" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="0.5">SECURITYDIRECT</text>
  <text x="400" y="252" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">SMART SECURITY. TOTAL PEACE OF MIND.</text>

  <!-- Screen 1 Card Mockup -->
  <g transform="translate(200, 280)">
    <rect width="400" height="155" rx="20" fill="#111827" fill-opacity="0.8" stroke="#1f293d" stroke-width="1.5" />
    <rect x="16" y="16" width="368" height="36" rx="10" fill="#ef4444" fill-opacity="0.2" />
    <text x="32" y="40" fill="#ef4444" font-family="sans-serif" font-size="13" font-weight="800">SCREEN 1 • PTZ CAMERAS</text>
    <text x="32" y="80" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">Hikvision 4MP IP Camera R2,399</text>
    <rect x="32" y="102" width="120" height="28" rx="8" fill="#ef4444" />
    <text x="92" y="120" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">LIVE PREVIEW</text>
    <rect x="165" y="102" width="180" height="28" rx="8" fill="#1e293b" />
    <text x="255" y="120" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Google Play Verified</text>
  </g>

  <!-- Screen 2 Card Mockup -->
  <g transform="translate(200, 455)">
    <rect width="400" height="155" rx="20" fill="#111827" fill-opacity="0.8" stroke="#1f293d" stroke-width="1.5" />
    <rect x="16" y="16" width="368" height="36" rx="10" fill="#ef4444" fill-opacity="0.2" />
    <text x="32" y="40" fill="#ef4444" font-family="sans-serif" font-size="13" font-weight="800">SCREEN 2 • INSTALL SERVICE</text>
    <text x="32" y="80" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">4-Camera Setup Booking R2,499</text>
    <circle cx="50" cy="118" r="12" fill="#ef4444" fill-opacity="0.3" />
    <text x="50" y="123" fill="#ef4444" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">✓</text>
    <text x="72" y="122" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">High-Speed Native Engine</text>
  </g>

  <!-- Screen 3 Card Mockup -->
  <g transform="translate(200, 630)">
    <rect width="400" height="155" rx="20" fill="#111827" fill-opacity="0.8" stroke="#1f293d" stroke-width="1.5" />
    <rect x="16" y="16" width="368" height="36" rx="10" fill="#ef4444" fill-opacity="0.2" />
    <text x="32" y="40" fill="#ef4444" font-family="sans-serif" font-size="13" font-weight="800">SCREEN 3 • NIGHT VISION</text>
    <text x="32" y="80" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">IP66 Weatherproof 24/7 Security</text>
    <rect x="32" y="102" width="336" height="32" rx="8" fill="#ef4444" />
    <text x="200" y="123" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.5">REQUEST SIMILAR APP QUOTE</text>
  </g>

  <!-- Bottom Navigation Bar on Phone -->
  <g transform="translate(200, 810)">
    <rect width="400" height="60" rx="16" fill="#0a0f1d" stroke="#1e293b" stroke-width="1" />
    <circle cx="60" cy="30" r="14" fill="#ef4444" />
    <rect x="130" y="24" width="30" height="12" rx="6" fill="#334155" />
    <rect x="200" y="24" width="30" height="12" rx="6" fill="#334155" />
    <rect x="270" y="24" width="30" height="12" rx="6" fill="#334155" />
    <rect x="340" y="24" width="30" height="12" rx="6" fill="#334155" />
  </g>

  <!-- Bottom Home Indicator Bar -->
  <rect x="330" y="910" width="140" height="5" rx="2.5" fill="#475569" />
</svg>