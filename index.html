    <!-- JSON-LD FAQPage Structured Data for Google Rich Results & SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is the Android Mobile App really only R4,500? Are there any hidden fees?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! Our R4,500 special is an all-inclusive setup package. It includes full eCommerce store functionality, product catalog setup, secure payment gateway integration (PayFast, Ozow, Payflex), push notifications, admin panel, and publishing your app directly to the Google Play Store. The only external cost is Google's one-time developer registration fee ($25 USD, approx R460 paid once directly to Google)."
          }
        },
        {
          "@type": "Question",
          "name": "Do I own the source code and the app once it is built?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "100% yes! Unlike restrictive subscription platforms that hold your business hostage, with GeekForge you own the full source code, customer database, and app assets outright. You are never locked in."
          }
        },
        {
          "@type": "Question",
          "name": "Can I connect the Android App to my existing WordPress or Shopify store?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutely. We specialize in synchronizing existing WooCommerce, Shopify, or custom inventory databases with the Android app. Any product you add to your website will automatically appear in your mobile app in real-time, with synced stock quantities."
          }
        },
        {
          "@type": "Question",
          "name": "What payment gateways do you support for South African stores?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We integrate all leading South African payment providers, including PayFast, Ozow Instant EFT, Payflex (buy now, pay later), Yoco, Peach Payments, SnapScan, Zapper, and direct bank EFT with automated proof of payment verification."
          }
        },
        {
          "@type": "Question",
          "name": "What is the turnaround time for a website or mobile app?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Standard professional websites take between 5 to 7 business days from content submission. Our R4,500 Android eCommerce App takes 7 to 10 business days, including Google Play Store review and publishing. Custom SaaS or complex portals take 2 to 3 weeks."
          }
        },
        {
          "@type": "Question",
          "name": "Do you handle domain registration, hosting, and business emails?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, we take care of the entire pipeline. We register your .co.za domain, set up high-speed SSD cloud hosting with SSL security certificates, and configure professional business emails (e.g. info@yourdomain.co.za) for you and your staff."
          }
        },
        {
          "@type": "Question",
          "name": "What happens after launch? Do you offer ongoing support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every project includes 30 days of complimentary post-launch support and training on how to use your admin panel. We also offer affordable monthly care plans starting from R450/month for automated backups, security patching, and content updates."
          }
        }
      ]
    }
    </script>
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('geekforge_theme');
          const isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

  </body>
